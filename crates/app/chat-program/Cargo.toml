[package]
name = "chat-program"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
abi = { path = "../../sdk/abi" }
guest = { path = "../../sdk/guest" }
modules = { path = "../../modules" }
chat = { path = "../chat" }
serde_json = "1"

[workspace]

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
