[package]
name = "forge-view"
edition.workspace = true
version.workspace = true
publish = false

# A Rust-authored view, exported as a dynamically loaded wasm module by
# `export_view!`. It links `forge` for its wire and `chat` for the
# conversation wire, both with their `program` feature off: the types and
# rules, no host import and no program export.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ducktape-view-guest.workspace = true
abi.workspace = true
base64.workspace = true
borsh.workspace = true
chat = { workspace = true, features = ["view"] }
ducklink.workspace = true
forge = { workspace = true, features = ["view"] }
futures.workspace = true
identity = { workspace = true, features = ["view"] }
pulldown-cmark.workspace = true
serde.workspace = true
serde_json.workspace = true
