[package]
name = "forge"
edition.workspace = true
version.workspace = true

# The types and rules are always built and run natively over any `store`;
# `forge-view` links them with `program` off. `program` adds the wasm32
# program over the host: `guest`'s contexts, the `alloc`/`call` exports and
# the `ducktape.*` imports.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
program = ["dep:guest", "store/program"]
# `view` adds the marker a view names this program by.
view = ["dep:ducktape-view-guest"]
# `describe` makes this crate\'s wasm build the `ducktape.describe` module:
# the `describe` export alone, no program, no imports.
describe = []

[dependencies]
ducktape-view-guest = { workspace = true, optional = true }
abi = { workspace = true }
describe = { workspace = true }
guest = { workspace = true, optional = true }
borsh = { workspace = true }
chat = { workspace = true }
gitcore = { workspace = true }
store = { workspace = true }

[dev-dependencies]
sha2 = { version = "0.10", default-features = false }
