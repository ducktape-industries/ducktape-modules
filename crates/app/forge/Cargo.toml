[package]
name = "forge"
edition.workspace = true
version.workspace = true

# The types and rules are always built and run natively over any `Sandbox`;
# `forge-view` links them with `program` off. `program` adds the wasm32
# program over the host: `guest`'s contexts, the `alloc`/`call` exports and
# the `ducktape.*` imports.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
program = ["dep:guest"]

[dependencies]
gitcore = { workspace = true }
abi = { workspace = true }
guest = { workspace = true, optional = true }
borsh = { workspace = true }
serde_json = { workspace = true }
chat = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
