[package]
name = "chat-view"
edition.workspace = true
version.workspace = true
publish = false

# A Rust-authored view, exported as a dynamically loaded WASM component by
# `export_view!`; `unsafe_code` is not forbidden only because the component
# exports need `#[unsafe(export_name)]`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ducktape-view-guest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
ducklink.workspace = true
chat = { path = "../chat" }
unicode-normalization.workspace = true
