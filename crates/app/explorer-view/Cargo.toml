[package]
name = "explorer-view"
edition.workspace = true
version.workspace = true
publish = false

# A Rust-authored view, exported as a dynamically loaded wasm module by
# `export_view!`; `unsafe_code` is not forbidden only because the module
# exports need `#[unsafe(export_name)]`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures.workspace = true
# `abi::hex` is how a code blob id reaches the screen.
abi.workspace = true
borsh.workspace = true
ducktape-view-guest.workspace = true
# mints the `duck://<chain>/explorer/…` link a page copies
ducklink.workspace = true
# The op types of every program a view may link, so a transaction's payload
# reads as its operation rather than bytes.
chat.workspace = true
forge.workspace = true
identity = { workspace = true, features = ["view"] }
module-registry = { workspace = true, features = ["view"] }
valset = { workspace = true, features = ["view"] }
serde.workspace = true

# What a test needs to play the node: the borsh replies the program would
# write, and the envelope the host door would open.
[dev-dependencies]
