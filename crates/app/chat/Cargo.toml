[package]
name = "chat"
version.workspace = true
edition.workspace = true

# The types and rules are always built; the view links them with `module`
# off. `module` adds the wasm32 entry points `store::entrypoint!` expands to:
# the `alloc`/`call` exports and the `ducktape.*` imports.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
module = ["store/module"]
# `view` adds the marker a view names this module by.
view = ["dep:ducktape-view-guest"]
# `describe` makes this crate's wasm build the `ducktape.describe` module:
# the `describe` export alone, no module, no imports.
describe = []

[dependencies]
ducktape-view-guest = { workspace = true, optional = true }
abi = { workspace = true }
describe = { workspace = true }
borsh = { workspace = true }
identity = { workspace = true }
serde = { workspace = true }
store = { workspace = true }
unicode-normalization = { workspace = true }

[dev-dependencies]
store = { workspace = true }
