[package]
name = "chat"
version.workspace = true
edition.workspace = true

# The types and rules are always built; the view links them with `program`
# off. `program` adds its wasm exports
# (`guest::export!`), which only its own wasm build turns on.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
program = []
# `view` adds the marker a view names this program by.
view = ["dep:ducktape-view-guest"]
# `describe` makes this crate's wasm build the `ducktape.describe` module:
# the `describe` export alone, no program, no imports.
describe = []

[dependencies]
ducktape-view-guest = { workspace = true, optional = true }
abi = { workspace = true }
describe = { workspace = true }
borsh = { workspace = true }
guest = { workspace = true }
identity = { workspace = true }
serde = { workspace = true }
store = { workspace = true }
unicode-normalization = { workspace = true }

[dev-dependencies]
store = { workspace = true }
