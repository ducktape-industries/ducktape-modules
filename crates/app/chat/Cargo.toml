[package]
name = "chat"
version.workspace = true
edition.workspace = true

# The types and rules are always built; the view links them with `program`
# off. `program` adds the wasm32 program over the host: `guest`'s contexts,
# the `alloc`/`call` exports and the `ducktape.*` imports.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
program = ["dep:guest", "dep:identity", "store/program"]
# `view` adds the marker a view names this program by.
view = ["dep:ducktape-view-guest"]
# `describe` makes this crate's wasm build the `ducktape.describe` module:
# the `describe` export alone, no program, no imports.
describe = []

[dependencies]
ducktape-view-guest = { workspace = true, optional = true }
abi = { workspace = true }
describe = { workspace = true }
borsh = { workspace = true }
guest = { workspace = true, optional = true }
identity = { workspace = true, optional = true }
serde = { workspace = true }
store = { workspace = true }
serde_json = { workspace = true }
unicode-normalization = { workspace = true }

[dev-dependencies]
store = { workspace = true }
