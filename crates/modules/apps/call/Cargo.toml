[package]
name = "call"
edition.workspace = true
version.workspace = true

# the call module's media guest: the OFF-consensus real-time media logic a
# huddle rides — Opus framing + per-speaker jitter buffering + client-side
# mixing (voice), video frame fragmentation/reassembly and the
# `/v1/call/ws` binary framing — as a pure library that builds for
# wasm32-unknown-unknown with NO host imports. Ported from ducktape
# `crates/services/media` at dfa41ce12409fe0e3403b7c71d04ae49aa04dd40; the
# transport, the task pump, the clock and the random epoch stay with the host
# and arrive as explicit inputs. The picture codec (JPEG) is native-only and
# deliberately absent. `realtime` is the `ducktape:lane/media` shim over
# these planes — the hub's fan-out/roster/beacon behavior (Core 99da94b68
# bin/node/src/voice.rs) as a sans-I/O step function — and `guest.rs`
# exports it as the component.
[features]
# the component export (src/guest.rs) for the `ducktape:lane@0.1.0` world
# `media`. wasm-only: `cargo rustc --features guest --crate-type cdylib
# --target wasm32-unknown-unknown`, then `wasm-tools component new`.
guest = []
# the wasm self-test harness (src/selftest.rs): exports every unit test as a
# C-ABI entry so a plain wasm runtime can execute them without libtest.
selftest = []

[dependencies]
# pure-Rust Opus (no C, no allocator tricks): the exact version the Core
# media service is locked to.
opus-rs = "=0.1.23"
thiserror = "2"
# the realtime world's bindings (types + the export macro), pinned to the SDK
# revision whose wit/media.wit the Core executor was built against — a
# separate git source from the workspace's `branch = "dev"` pin on purpose:
# that lock predates the lane world, and this is a contract candidate.
ducktape-lane-sdk = { git = "https://github.com/ducktape-industries/ducktape-sdk", rev = "3a8cae51283c5185fbac34628985e1960adcc1ec", package = "ducktape-lane-sdk" }
# the flow id derivation (`data_plane::FlowId::derive`: sha256, first 8 bytes).
sha2 = { workspace = true }
# the client control frames on `/v1/call/ws` are json text.
serde = { workspace = true }
serde_json = { workspace = true }
