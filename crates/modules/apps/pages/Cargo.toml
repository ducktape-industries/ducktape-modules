[package]
name = "pages"
edition.workspace = true
version.workspace = true

# the consensus state machine, wire types, sdk::Module impl, AND the pure
# index decision core (src/index.rs) always compile — natively for the node
# and to wasm32 for both guest artifacts. the two features are the guests:
[features]
# the wasm consensus port (src/guest.rs): the dispatch shell over
# ducktape-module-sdk. wasm-only — enabled solely by the guest-builder's
# synthesized cdylib workspace.
guest = ["dep:ducktape-module-sdk"]
# the wasm index mapper shell (src/index_guest.rs): wires the pure index core
# into the fluent31 engine. wasm-only — enabled solely by
# `guest-builder --index`.
index-guest = ["index_guest/guest"]

[dependencies]
duck-address = { workspace = true }
# wasm-only, behind `guest`: the port harness. a standalone-workspace path
# crate, pulled only when the guest build compiles this crate for wasm32.
ducktape-module-sdk = { workspace = true, optional = true }
sdk = { workspace = true }
serde = { workspace = true }
# the index CONTRACT (op-row envelope + the pure StateRead/Writes kit) — not
# the engine: the default surface is pure types, wasm32-clean, and is all the
# native build sees. the engine shell rides the `index-guest` feature.
index_guest = { workspace = true }
async-trait = "0.1"
serde_json = "1"
# the logical-key -> store-key hash (sha256); the store itself is injected.
sha2 = { workspace = true }

[dev-dependencies]
borsh = { workspace = true }
keyscheme = { workspace = true, features = ["testkit"] }
futures = { workspace = true }
commonware-cryptography = { workspace = true }
dispatch-module = { git = "https://github.com/ducktape-industries/ducktape", branch = "dev", package = "dispatch" }
wasm-host = { workspace = true }
# the native Files implementation the pages tests run against. It lives in the
# platform repo, so it is named here rather than through the workspace table.
files-module = { git = "https://github.com/ducktape-industries/ducktape", branch = "dev", package = "files", features = ["native"] }
# native identity and attribution modules used by the integration tests.
identity-module = { git = "https://github.com/ducktape-industries/ducktape", branch = "dev", package = "identity" }
attribution-module = { git = "https://github.com/ducktape-industries/ducktape", branch = "dev", package = "attribution" }
host = { workspace = true }
sdk-testkit = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
# the tests drive the module the way a host does: construct the concrete
# QmdbStore and inject it as `Box<dyn MerkleStore>`.
statesync = { workspace = true }
commonware-runtime = { workspace = true }
