[package]
name = "admission"
version.workspace = true
edition.workspace = true

# The types and the rules over `store` are always built; a view links them
# with `program` off. `program` adds the wasm32 program over the host:
# `guest`'s contexts, the `alloc`/`call` exports and the `ducktape.*` imports.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
program = ["dep:guest", "store/program"]

[dependencies]
abi = { workspace = true }
borsh = { workspace = true }
guest = { workspace = true, optional = true }
module-registry = { workspace = true }
store = { workspace = true }
valset = { workspace = true }
