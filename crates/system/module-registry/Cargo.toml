[package]
name = "module-registry"
version.workspace = true
edition.workspace = true

# The contract types and the rules over `store` are always built; a view links them with `module`
# off. `module` adds the wasm32 entry points `store::entrypoint!` expands to:
# the `alloc`/`call` exports and the `ducktape.*` imports.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
module = ["store/module"]
# `view` adds the marker a view names this module by.
view = ["dep:ducktape-view-guest"]
# `describe` makes this crate\'s wasm build the `ducktape.describe` module:
# the `describe` export alone, no module, no imports.
describe = []

[dependencies]
ducktape-view-guest = { workspace = true, optional = true }
abi = { workspace = true }
describe = { workspace = true }
borsh = { workspace = true }
store = { workspace = true }

# The founding suite (`tests/system.rs`) drives the built boot set on the host.
[dev-dependencies]
identity = { workspace = true }
valset = { workspace = true }
commonware-cryptography = { workspace = true }
commonware-runtime = { workspace = true }
fixture-probe = { workspace = true }
host = { workspace = true }
keyscheme = { workspace = true, features = ["testkit"] }
tempfile = { workspace = true }
