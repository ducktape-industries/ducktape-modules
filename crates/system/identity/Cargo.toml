[package]
name = "identity"
version.workspace = true
edition.workspace = true

# The types and the rules over `store` are always built; a view links them
# with `module` off. `module` adds its wasm exports (`guest::export!`), which
# only its own wasm build turns on. `view` adds the marker a view names
# identity by.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
module = []
view = ["dep:ducktape-view-guest"]
# `describe` makes this crate\'s wasm build the `ducktape.describe` module:
# the `describe` export alone, no module, no imports.
describe = []

[dependencies]
abi = { workspace = true }
describe = { workspace = true }
borsh = { workspace = true }
serde = { workspace = true }
guest = { workspace = true }
store = { workspace = true }
ducktape-view-guest = { workspace = true, optional = true }
