[package]
name = "identity"
version.workspace = true
edition.workspace = true

# The types, the rules over `store` and the asks another program makes of
# identity (`account_of`, `account`) are always built; a view links them with
# `program` off. `program` adds the wasm32 program over the host: `guest`'s
# contexts, the `alloc`/`call` exports and the `ducktape.*` imports.
# `view` adds the one ask a view makes of identity directly: the seated key
# resolved to the account it holds, through `host.rpc.query` — chat-view and
# forge-view both gate writes on it, so it lives once here.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
program = ["dep:guest", "store/program"]
view = ["dep:ducktape-view-guest"]

[dependencies]
abi = { workspace = true }
borsh = { workspace = true }
guest = { workspace = true, optional = true }
module-registry = { workspace = true }
store = { workspace = true }
ducktape-view-guest = { workspace = true, optional = true }
