[package]
name = "valset"
version.workspace = true
edition.workspace = true

# The types are always built; a view links them with `program` off. `guest`
# adds the ask another program makes of valset (`standing`); `program` adds
# the wasm32 program over the host: `guest`'s contexts, the `alloc`/`call`
# exports and the `ducktape.*` imports.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
guest = ["dep:guest"]
program = ["guest"]

[dependencies]
abi = { workspace = true }
borsh = { workspace = true }
guest = { workspace = true, optional = true }
module-registry = { workspace = true }
