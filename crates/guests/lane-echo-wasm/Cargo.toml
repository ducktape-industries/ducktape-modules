# The smallest `ducktape:lane/media` guest: echoes every event back as the
# matching effect, so a host probe can drive one step per event kind and see
# every effect variant cross the boundary. Standalone workspace like every
# guest crate: wasm32-unknown-unknown, componentized by `guest-builder
# componentize`, never built by the host workspace.
[package]
name = "lane-echo-wasm"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ducktape-lane-sdk = { path = "../../lane-sdk" }

[workspace]

# Path dependency symbol hashes differ across checkouts; omit debug names.
[profile.release]
strip = "symbols"
