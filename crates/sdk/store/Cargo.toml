[package]
name = "store"
version.workspace = true
edition.workspace = true

# The module SDK: the `Reads`/`Writes` store traits, the typed
# `Map`/`Set`/`Item` tables, `PageRequest`/`PageResponse`, the error
# constructors, and the kernel's types under the SDK's names (`kernel.rs`).
# Always built; a view links it with `module` off. `module` adds the wasm32
# glue `entrypoint!` expands to; natively `testing::MockHost` is the store a
# test runs a module's rules over.
[features]
module = []

[dependencies]
abi = { workspace = true }
borsh = { workspace = true }
serde = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sha1 = "0.10"
sha2 = { workspace = true }
