# GPUI-shaped guest contexts, host IO, editor primitives and typed tests.
[package]
name = "view-guest"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Renderer-independent WASM view execution and host protocol"

[dependencies]
futures.workspace = true
view-wire.workspace = true
design.workspace = true
serde.workspace = true
serde_json.workspace = true
gpui.workspace = true
view-guest-derive = { path = "../view-guest-derive" }
unicode-segmentation = "1"

[[example]]
name = "exported_view"
crate-type = ["cdylib"]

[[example]]
name = "media_probe"
crate-type = ["cdylib"]
