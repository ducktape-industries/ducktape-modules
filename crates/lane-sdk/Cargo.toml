# The realtime lane SDK: the `ducktape:lane/media` bindings a lane guest
# (an audio tenant) is authored against. A SEPARATE crate from
# `ducktape-module-sdk` on purpose: that crate's world (`ducktape:module`) is
# hashed into every founded workspace and stays byte-identical; this one is a
# contract candidate under Core review. Same shape as module-sdk otherwise —
# standalone workspace, wasm32-unknown-unknown only, bindings generated once
# here and reused by every guest through the export macro.
[package]
name = "ducktape-lane-sdk"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
wit-bindgen = "0.57"

[workspace]
