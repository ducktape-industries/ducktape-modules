# Linux only by owner order; macOS runners are deliberately excluded.
# make wasm-modules, wasm-modules-check, ops/wasm-repro-check.sh, and the
# extension-probe build/check rebuild guests or views; defer them to nightly.
name: ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 3

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --lib --no-fail-fast
      - run: cargo clippy --locked --workspace --tests --no-deps -- -D warnings
      - run: cargo build --locked --release --target wasm32-unknown-unknown -p chat-view
      - run: make wasm-programs
