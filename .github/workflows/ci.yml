# Linux only by owner order; macOS runners are deliberately excluded.
name: ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 3

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: cargo fmt --all -- --check
      # chat and chat-view are red until chat is a program; everything else runs.
      - run: cargo test --locked --workspace --exclude chat --exclude chat-view --no-fail-fast
      - run: cargo clippy --locked --workspace --exclude chat --exclude chat-view --tests --no-deps -- -D warnings
      - run: make program-wasm-check CARGO="cargo --locked"
      - run: make view-wasm-check CARGO="cargo --locked"
      - run: make wasm-programs CARGO="cargo --locked"
