# The one toolchain this tree builds with, pinned exactly: a program's wasm
# bytes are rustc-dependent, and every validator must hash the same bytes for
# the same source.
#
# `targets` lists every triple something in this tree passes to `--target`:
#   wasm32-unknown-unknown — programs (`abi`, `guest`) and views
#     (`view-guest`) compile for it. No WASI guest exists.
[toolchain]
channel = "1.96.1"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
