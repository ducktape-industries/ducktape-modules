# ducktape-sdk — the contract line of the ducktape platform.
#
# What lives here: the program contract (`abi`, the borsh bytes ABI a wasm
# program and the host share; `guest`, what a program compiles against), the
# view contract (`view-wire`, `view-guest`, `design`) and `ducklink`, the
# `duck://` grammar every plane reads.
#
# This workspace depends on NO other ducktape repository. Everything else in
# the platform depends on it. Program logic lives in ducktape-modules; the
# host that runs it lives in ducktape.

[workspace]
resolver = "2"
members = [
    "crates/kernel/abi",
    "crates/kernel/guest",
    "crates/ducklink",
    "crates/design",
    "crates/view-wire",
    "crates/view-guest",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# ---- external
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# borsh — the one codec the program abi is written in.
borsh = { version = "1", default-features = false, features = ["derive", "std"] }
futures = "0.3"

# ---- internal
abi = { path = "crates/kernel/abi" }
guest = { path = "crates/kernel/guest" }
ducklink = { path = "crates/ducklink" }
design = { path = "crates/design" }
view-wire = { path = "crates/view-wire" }
view-guest = { path = "crates/view-guest" }

[profile.dev.package.design]
opt-level = 2
