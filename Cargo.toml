# ducktape-modules — the application modules and their views, one flat
# `crates/<name>` each: `chat` is the consensus module, `chat-view` the wasm
# view the desktop renders for it.
#
# A module crate implements `sdk::Module` and carries its own wasm guest port
# (`src/guest.rs` behind the `guest` feature), plus — where it ships a
# materialized view — an index guest (`src/index_guest.rs` behind
# `index-guest`). The committed `component.wasm`, `index.wasm` and `guest.lock`
# beside each crate are the artifacts a network runs; this is the repository
# they are built out of. A `<name>-view` crate is a cdylib for
# wasm32-unknown-unknown on `view-guest`, and links no module: the slice of a
# module it speaks is copied in-crate.
#
# The reference tenants sit beside them: `directory` (the first wasm port, the
# template every later one followed), `greeter` (a consumer module composed
# purely from sibling types) and `extension-probe` (standalone workspaces,
# excluded from this one — module, view and service replacement against fixed
# native executables).
#
# Nothing here is a kernel: the module contract (`sdk`), the module SDK
# (`ducktape-module-sdk`), the view SDK (`view-guest`), the index contract and
# the system modules come from ducktape-sdk; the host, statesync and the native
# system modules a test drives come from ducktape.

[workspace]
resolver = "2"
members = [
    # apps — the product feature modules
    "crates/agent",
    "crates/automations",
    "crates/boards",
    "crates/call",
    "crates/chat",
    "crates/collaboration",
    "crates/inbox",
    "crates/pages",
    "crates/runs",
    "crates/tasks",
    # views — the wasm views the desktop renders, beside the module they draw
    "crates/chat-view",
    # examples — reference modules, in no genesis set
    "crates/directory",
    "crates/greeter",
]

# which repository this workspace IS. guest-builder reaches every module
# through this URL as a git source at the revision it builds, and the URL is
# part of every symbol hash — so it is written once, here, rather than guessed
# from a checkout's remote.
[workspace.metadata.guest-builder]
platform = "https://github.com/ducktape-industries/ducktape-modules"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# ---------------------------------------------------------------------------
# ducktape-sdk — the module contract and the system modules.
#
# A SYSTEM MODULE IS ITS OWN API: `identity = { workspace = true }` links the
# module crate — its types, codecs and a `client` of typed functions over
# `Ctx` — with the module logic off behind features. An app module here that
# needs a sibling links it by path (`chat = { path = "../chat" }` in
# automations and runs).
# ---------------------------------------------------------------------------
sdk = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "sdk" }
# the module SDK a guest port compiles against. wasm-only: every module's
# `guest` feature turns it on, and only guest-builder's shell workspace does.
ducktape-module-sdk = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "ducktape-module-sdk" }
# dev-only shared test doubles for the sdk boundary traits (TestCtx +
# in-memory MerkleStore). MAY ONLY appear in `[dev-dependencies]`.
sdk-testkit = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "sdk-testkit" }
wasm-host = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "wasm-host" }
# the closed signature-scheme set + ONE verifier.
keyscheme = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "keyscheme" }
# keyed with the underscore ON PURPOSE: module crates declare a feature named
# `index-guest` (the guest-builder --index contract), and cargo refuses a
# feature sharing its name with a non-optional dependency key.
index_guest = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "index-guest" }

# system modules a module here calls: each crate is its own api (types +
# codecs + a `client` of typed functions over `Ctx`); the module logic behind
# it rides the `guest` feature no consumer turns on.
identity = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "identity" }
attribution = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "attribution" }

# the `duck://` address grammar.
duck-address = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "duck-address" }

# ---------------------------------------------------------------------------
# ducktape — the platform. DEV-ONLY here, except the two pure envelope crates:
# a test drives a module the way a host does (construct the concrete QmdbStore
# and inject it as `Box<dyn MerkleStore>`), which needs the real kernel.
# ---------------------------------------------------------------------------
host = { git = "https://github.com/ducktape-industries/ducktape", branch = "dev", package = "host" }
statesync = { git = "https://github.com/ducktape-industries/ducktape", branch = "dev", package = "statesync" }
# the run envelope's magic + headless composer, and the node-side work spec —
# both leaf libraries in ducktape-sdk, not the platform.
run-envelope = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "run-envelope" }
node-work = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "node-work" }

# ---------------------------------------------------------------------------
# internal — the reference modules in this repo
# ---------------------------------------------------------------------------
directory = { path = "crates/directory" }
greeter = { path = "crates/greeter" }

# ---------------------------------------------------------------------------
# external
# ---------------------------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
async-trait = "0.1"
futures = "0.3"
# a view links only the view guest sdk (host protocol + widget kit), never a
# module's crate: the slice of a module it speaks is copied in-crate.
ducktape-view-guest = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "view-guest" }
unicode-segmentation = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
# duckfs path normalization: NFC so visually-identical names collide instead
# of coexisting (a consensus-determinism requirement, not cosmetics).
unicode-normalization = "0.1"
# tests only: isolated on-disk module data dirs.
tempfile = "3"
# borsh — the deterministic store-record and op-row codec (one byte layout, no
# map ordering games). `wire` stays sdk::wire.
borsh = { version = "1", default-features = false, features = ["derive", "std"] }
# commonware — one ecosystem, version-aligned. Dev-only here: the concrete
# runtime a store-backed module's tests spin up.
commonware-runtime = "2026.9.0"
commonware-cryptography = "2026.9.0"

# proc-macro and build-script crates (serde_derive, async-trait, borsh-derive)
# are compiled once and then run for every unit below them — unoptimized they
# dominate a debug build.
[profile.dev.build-override]
opt-level = 2

# a view ships as a cdylib for wasm32-unknown-unknown loaded from a file; the
# release profile is what its bytes come out of. module guests are built by
# guest-builder in its own workspace and never see this profile.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
