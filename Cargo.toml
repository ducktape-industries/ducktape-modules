# modules — the ducktape contract line and the modules written against it,
# one repository.
#
#   crates/sdk/     the contracts: `abi` (the borsh bytes ABI a module and the
#                   host share, a byte-for-byte copy of the kernel's),
#                   `store` (the module SDK: the `Reads`/`Writes` store,
#                   typed tables, paging, errors, `entrypoint!`, the kernel's
#                   types under the SDK's names in `kernel.rs`, and
#                   `testing::MockHost` to run a module natively), `ducklink`
#                   (the `duck://` grammar), and the view contract
#                   (`view-wire`, `view-guest`, `design`)
#   crates/system/  the boot set: module-registry, valset and identity, one
#                   crate each in the same shape as the app modules; the
#                   suite under module-registry/tests founds ducktape's host
#                   over the bytes `make wasm-programs` built
#   crates/app/     the app modules: chat and forge (each one crate: types and
#                   rules always, the wasm32 module behind the `module`
#                   feature), chat-view and forge-view (which link their
#                   module crate with the feature off) and the system views
#   crates/lib/     libraries a module links: gitcore (git objects, packs,
#                   walks, diffs, the wire's server side)
#
# A view links its module by path and reads its types; a view is a cdylib for
# wasm32-unknown-unknown on `view-guest`. The host that runs the modules
# (runtime, state, blobs, host, node, consensus, the daemon) lives in ducktape,
# and `crates/sdk/abi` is a copy of its `crates/kernel/abi`: the `[patch]`
# below makes the host the suite links compile against the copy, and
# `make kernel-abi-check` fails when the copy differs from the kernel's at all.

[workspace]
resolver = "2"
members = [
    "crates/sdk/abi",
    "crates/sdk/store",
    "crates/sdk/ducklink",
    "crates/sdk/design",
    "crates/sdk/describe",
    "crates/sdk/view-wire",
    "crates/sdk/view-guest",
    "crates/sdk/view-guest-derive",
    "crates/system/module-registry",
    "crates/system/valset",
    "crates/system/identity",
    "crates/app/chat",
    "crates/app/chat-view",
    "crates/app/forge-view",
    "crates/app/members-view",
    "crates/app/node-view",
    "crates/app/explorer-view",
    "crates/app/settings-view",
    "crates/app/forge",
    "crates/lib/gitcore",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# ---- the contracts, in tree
abi = { path = "crates/sdk/abi" }
store = { path = "crates/sdk/store" }
gitcore = { path = "crates/lib/gitcore" }
ducklink = { path = "crates/sdk/ducklink" }
design = { path = "crates/sdk/design" }
view-wire = { path = "crates/sdk/view-wire" }
describe = { path = "crates/sdk/describe" }
view-guest = { path = "crates/sdk/view-guest" }
ducktape-view-guest = { path = "crates/sdk/view-guest", package = "view-guest" }
gpui = { package = "gpui-pre", git = "https://github.com/ducktape-industries/gpui-pre", rev = "79bdf74455094b943794cc32aa136a48f445cdb9", default-features = false }
module-registry = { path = "crates/system/module-registry" }
valset = { path = "crates/system/valset" }
identity = { path = "crates/system/identity" }
chat = { path = "crates/app/chat" }
forge = { path = "crates/app/forge" }

# ---- the host the founding suite runs the boot set on, the probe fixture it
# seats and the key schemes it signs with (dev-dependencies only)
host = { git = "https://github.com/ducktape-industries/ducktape", rev = "d1805fcbe47ce066af109bff2531506c903719f4" }
fixture-probe = { git = "https://github.com/ducktape-industries/ducktape", rev = "d1805fcbe47ce066af109bff2531506c903719f4" }
keyscheme = { git = "https://github.com/ducktape-industries/ducktape", rev = "d1805fcbe47ce066af109bff2531506c903719f4" }
commonware-cryptography = "2026.9.0"
commonware-runtime = "2026.9.0"

# ---- external
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# borsh — the one codec the module abi is written in.
borsh = { version = "1", default-features = false, features = ["derive", "std"] }
sha2 = "0.10"
tempfile = "3"
base64 = "0.22"
futures = "0.3"
# Forge's markdown: CommonMark + GFM, no HTML writer and no CLI.
pulldown-cmark = { version = "0.13", default-features = false }
# duckfs path normalization: NFC so visually-identical names collide instead
# of coexisting (a consensus-determinism requirement, not cosmetics).
unicode-normalization = "0.1"

[patch."https://github.com/ducktape-industries/ducktape"]
abi = { path = "crates/sdk/abi" }

# proc-macro and build-script crates (serde_derive, async-trait, borsh-derive)
# are compiled once and then run for every unit below them — unoptimized they
# dominate a debug build.
[profile.dev.build-override]
opt-level = 2

[profile.dev.package.design]
opt-level = 2

# a view and a module ship as cdylibs for wasm32-unknown-unknown; the release
# profile is what their bytes come out of.
[profile.release]
# Wire serde visitors dominate guests; optimize their shared code for size.
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# `make wasm-why`: the release bytes with their names, so twiggy can say
# whose they are. Its own output dir; nothing ships from it.
[profile.why]
inherits = "release"
strip = "debuginfo"

[patch.crates-io]
rmp-serde = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "79bdf74455094b943794cc32aa136a48f445cdb9" }
gpui-pre-scheduler = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "79bdf74455094b943794cc32aa136a48f445cdb9" }
gpui-pre-zlog = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "79bdf74455094b943794cc32aa136a48f445cdb9" }
