# modules — the ducktape contract line and the programs written against it,
# one repository.
#
#   crates/sdk/     the contracts: `abi` (the borsh bytes ABI a program and the
#                   host share), `guest` (what a program compiles against),
#                   `ducklink` (the `duck://` grammar), and the view contract
#                   (`view-wire`, `view-guest`, `design`)
#   crates/system/  the programs the host reads or every network founds with:
#                   modules (the roster), valset (the validators), identity
#   crates/app/     the app modules and the view beside each: chat, chat-view
#
# A view links its module by path and reads its types; a view is a cdylib for
# wasm32-unknown-unknown on `view-guest`. The host that runs the programs
# (runtime, state, blobs, host, node, consensus, the daemon) lives in ducktape.

[workspace]
resolver = "2"
members = [
    "crates/sdk/abi",
    "crates/sdk/guest",
    "crates/sdk/ducklink",
    "crates/sdk/design",
    "crates/sdk/view-wire",
    "crates/sdk/view-guest",
    "crates/system/modules",
    "crates/system/valset",
    "crates/system/identity",
    "crates/app/chat",
    "crates/app/chat-view",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# ---- the contracts, in tree
abi = { path = "crates/sdk/abi" }
guest = { path = "crates/sdk/guest" }
ducklink = { path = "crates/sdk/ducklink" }
design = { path = "crates/sdk/design" }
view-wire = { path = "crates/sdk/view-wire" }
view-guest = { path = "crates/sdk/view-guest" }
ducktape-view-guest = { path = "crates/sdk/view-guest", package = "view-guest" }

# ---- external
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# borsh — the one codec the program abi is written in.
borsh = { version = "1", default-features = false, features = ["derive", "std"] }
sha2 = "0.10"
base64 = "0.22"
async-trait = "0.1"
futures = "0.3"
# duckfs path normalization: NFC so visually-identical names collide instead
# of coexisting (a consensus-determinism requirement, not cosmetics).
unicode-normalization = "0.1"

# proc-macro and build-script crates (serde_derive, async-trait, borsh-derive)
# are compiled once and then run for every unit below them — unoptimized they
# dominate a debug build.
[profile.dev.build-override]
opt-level = 2

[profile.dev.package.design]
opt-level = 2

# a view and a program ship as cdylibs for wasm32-unknown-unknown; the release
# profile is what their bytes come out of.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
